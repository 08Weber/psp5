# PSP5 REMAKE – fork by medhatk (based on psp5 by 08Weber)
# Builds all variants (ARK-5, ARK-4, PSP Go), packages release zips,
# and automatically publishes a GitHub Release when pushing a v* tag or running manually with a version.
name: build

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.0.0) — leave empty to only build artifacts'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo bash tools/setup-wsl.sh
      - name: Build
        run: |
          bash tools/build.sh
          bash tools/build.sh ark4
          bash tools/build.sh test
      - name: Resolve release version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ] && [[ "$REF_NAME" == v* ]]; then
            echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_VERSION" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Zips
        run: |
          python3 tools/make_release.py "${{ steps.ver.outputs.version }}"
          sed "s/__VERSION__/${{ steps.ver.outputs.version }}/g" .github/RELEASE_BODY.md > release/RELEASE_BODY.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*.zip
      # testbygget med skriptat testläge (src/testrun.c) – för tools/ppsspp-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: dist-test/PSP/GAME/PSP5/EBOOT.PBP
      - name: GitHub Release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: PSP5 REMAKE v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_BODY.md
          files: release/*.zip
