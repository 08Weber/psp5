# psp5 – made by Mille Weber
# Bygger alla versioner (ARK-5, ARK-4, PSP Go) och packar release-zipparna.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo bash tools/setup-wsl.sh
      - name: Build
        run: |
          bash tools/build.sh
          bash tools/build.sh ark4
          bash tools/build.sh test
      - name: Zips
        run: python3 tools/make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/*.zip
      # testbygget med skriptat testläge (src/testrun.c) – för tools/ppsspp-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: test
          path: dist-test/PSP/GAME/PSP5/EBOOT.PBP
